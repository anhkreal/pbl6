# Test Configuration for v2.1
# ============================

[test_environment]
backend_url = http://localhost:8000
timezone = Asia/Ho_Chi_Minh

[test_users]
# Update these with actual test user IDs from your database
user1_id = 1
user1_name = Test User 1
user1_face_id = test_face_1

user2_id = 2
user2_name = Test User 2
user2_face_id = test_face_2

user3_id = 3
user3_name = Test User 3
user3_face_id = test_face_3

[shift_times]
day_start = 08:00
day_end = 14:00
night_start = 14:00
night_end = 20:00
grace_period_minutes = 30

[test_thresholds]
# Thresholds for test assertions
emotion_score_tolerance = 2.0
attendance_score_tolerance = 2.0
kpi_tolerance = 1.0

[concurrency]
# Thread-safety test parameters
concurrent_checkin_workers = 10
concurrent_emotion_workers = 20
concurrent_mark_seen_workers = 15
concurrent_checkout_workers = 10
race_condition_workers = 50

[penalties]
# Emotion penalties (for verification)
anger = -8
disgust = -7
fear = -6
sad = -5
surprise = -3

[kpi_weights]
attendance_weight = 0.7
emotion_weight = 0.3

[attendance_penalties]
late_penalty = -10
early_penalty = -10
